name: Build Exe for AllmT

env:
  fName: AllmT

on:
  push:
    branches:
      - main
    paths:
      - "Allmt/VERSION"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: win-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            suffix: NVIDIA
          - variant: rocm
            suffix: ROCM
          - variant: xpu
            suffix: XPU
          - variant: cpu
            suffix: CPU

    defaults:
      run:
        working-directory: Allmt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (${{ matrix.variant }})
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r req-${{ matrix.variant }}.txt
          pip install pyinstaller

      - name: Verify torch install
        run: |
          python -c "import torch; print('torch', torch.__version__)"

      - name: Check site-packages for GPU runtime DLLs (pre-build)
        shell: pwsh
        run: |
          $purelib = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path $purelib -Recurse -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'amdhip|hipblas|hipfft|hipsparse|hipsolver|rocblas|rocsolver|miopen|sycl|level_zero|ze_loader|pi_level_zero|ur_loader|opencl' } |
            Select-Object FullName

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "rocm" ]; then
            pyinstaller -y -w -D -n ${{ env.fName }}-${{ matrix.suffix }} \
              --collect-all torch \
              --collect-all rocm_sdk_core \
              --collect-all rocm_sdk_devel \
              --collect-all rocm_sdk_libraries_custom \
              --collect-all _rocm_sdk_core \
              --collect-all _rocm_sdk_libraries_custom \
              main.py
          elif [ "${{ matrix.variant }}" = "xpu" ]; then
            pyinstaller -y -w -D -n ${{ env.fName }}-${{ matrix.suffix }} \
              --collect-all torch \
              --collect-all dpcpp_cpp_rt \
              --collect-all intel_sycl_rt \
              --collect-all intel_opencl_rt \
              --collect-all intel_cmplr_lib_rt \
              --collect-all intel_cmplr_lib_ur \
              --collect-all intel_pti \
              --collect-all onemkl_sycl_blas \
              --collect-all onemkl_sycl_dft \
              --collect-all onemkl_sycl_lapack \
              --collect-all onemkl_sycl_rng \
              --collect-all onemkl_sycl_sparse \
              --collect-all tcmlib \
              --collect-all umf \
              main.py
          elif [ "${{ matrix.variant }}" = "nvidia" ]; then
            pyinstaller -y -w -D -n ${{ env.fName }}-${{ matrix.suffix }} \
              --collect-all torch \
              --collect-all nvidia \
              main.py
          else
            pyinstaller -y -w -D -n ${{ env.fName }}-${{ matrix.suffix }} main.py
          fi

      - name: Verify GPU runtime DLLs bundled (post-build)
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/${{ env.fName }}-${{ matrix.suffix }} -Recurse -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'amdhip|hipblas|hipfft|hipsparse|hipsolver|rocblas|rocsolver|miopen|sycl|level_zero|ze_loader|pi_level_zero|ur_loader|opencl' } |
            Select-Object Name, DirectoryName

      - name: Zip and split output
        shell: pwsh
        run: |
          $buildName = "${{ env.fName }}-${{ matrix.suffix }}"
          $archive = "dist/${{ env.fName }}-win-x64-${{ matrix.suffix }}.7z"

          Push-Location "dist/$buildName"

          7z a -v1900m -mx=9 -bsp1 "../../$archive" *

          Pop-Location

      - name: Set build version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.fName }}-win-x64-${{ matrix.suffix }}-${{ steps.version.outputs.version }}
          path: Allmt/dist/${{ env.fName }}-win-x64-${{ matrix.suffix }}.7z.*

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AllmT v${{ steps.version.outputs.version }}
          files: Allmt/dist/${{ env.fName }}-win-x64-${{ matrix.suffix }}.7z.*