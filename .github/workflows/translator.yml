name: Build Windows Executable

on:
  push:
    branches:
      - main
    paths:
      - "py-translate/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [nvidia, amd, intel, cpu]

    defaults:
      run:
        working-directory: py-translate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (${{ matrix.variant }})
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.variant }}" = "amd" ]; then
            pip install --no-deps -r req-${{ matrix.variant }}.txt
          else
            pip install -r req-${{ matrix.variant }}.txt
          fi
          pip install pyinstaller

      - name: Verify torch install
        run: |
          python -c "import torch; print('torch', torch.__version__)"

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AnnoTranslator-${{ matrix.variant }} main.py

      - name: Zip and split output
        shell: pwsh
        run: |
          7z a -v1900m dist/AnnoTranslator-windows-x64-${{ matrix.variant }}.7z dist/AnnoTranslator-${{ matrix.variant }}.exe

      - name: Set build date
        id: date
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d-%H')" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnnoTranslator-windows-x64-${{ matrix.variant }}-${{ steps.date.outputs.date }}
          path: py-translate/dist/AnnoTranslator-windows-x64-${{ matrix.variant }}.7z.*

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: Build ${{ steps.date.outputs.date }}
          files: py-translate/dist/AnnoTranslator-windows-x64-${{ matrix.variant }}.7z.*