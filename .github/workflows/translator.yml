name: Build Windows Executable

on:
  push:
    branches:
      - main
    paths:
      - "py-translate/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [nvidia, amd, intel, cpu]

    defaults:
      run:
        working-directory: py-translate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (${{ matrix.variant }})
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r req-${{ matrix.variant }}.txt
          pip install pyinstaller

      - name: Verify torch install
        run: |
          python -c "import torch; print('torch', torch.__version__)"

      - name: Locate ROCm DLLs
        shell: pwsh
        run: |
          python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path (python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])") -Recurse -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'amdhip|hipblas|hipfft|hipsparse|hipsolver|rocblas|rocsolver|miopen' } |
            Select-Object FullName

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "amd" ]; then
            pyinstaller -y -w -D -n AnnoTranslator-amd \
              --collect-all torch \
              --collect-all rocm_sdk_core \
              --collect-all rocm_sdk_devel \
              --collect-all rocm_sdk_libraries_custom \
              --collect-all _rocm_sdk_core \
              --collect-all _rocm_sdk_libraries_custom \
              main.py
          elif [ "${{ matrix.variant }}" = "intel" ]; then
            pyinstaller -y -w -D -n AnnoTranslator-intel \
              --collect-all torch \
              --collect-all dpcpp_cpp_rt \
              --collect-all intel_sycl_rt \
              --collect-all intel_opencl_rt \
              --collect-all intel_cmplr_lib_rt \
              --collect-all intel_cmplr_lib_ur \
              --collect-all intel_pti \
              --collect-all onemkl_sycl_blas \
              --collect-all onemkl_sycl_dft \
              --collect-all onemkl_sycl_lapack \
              --collect-all onemkl_sycl_rng \
              --collect-all onemkl_sycl_sparse \
              --collect-all tcmlib \
              --collect-all umf \
              main.py
          elif [ "${{ matrix.variant }}" = "nvidia" ]; then
            pyinstaller -y -w -D -n AnnoTranslator-nvidia \
              --collect-all torch \
              --collect-all nvidia \
              main.py
          else
            pyinstaller -y -w -D -n AnnoTranslator-${{ matrix.variant }} main.py
          fi

      - name: Zip and split output
        shell: pwsh
        run: |
          7z a -v1900m -mx=9 -bsp1 dist/AnnoTranslator-windows-x64-${{ matrix.variant }}.7z dist/AnnoTranslator-${{ matrix.variant }}/*

      - name: Set build date
        id: date
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d-%H')" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnnoTranslator-windows-x64-${{ matrix.variant }}-${{ steps.date.outputs.date }}
          path: py-translate/dist/AnnoTranslator-windows-x64-${{ matrix.variant }}.7z.*

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: Build ${{ steps.date.outputs.date }}
          files: py-translate/dist/AnnoTranslator-windows-x64-${{ matrix.variant }}.7z.*