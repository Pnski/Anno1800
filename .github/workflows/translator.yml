name: Build Windows Executable

on:
  push:
    branches:
      - main
    paths:
      - "py-translate/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: py-translate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify torch install
        run: |
          python -c "import torch; print('torch', torch.__version__)"

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AnnoTranslator main.py

      - name: Set build date
        id: date
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnnoTranslator-windows-x64-${{ steps.date.outputs.date }}
          path: py-translate/dist/AnnoTranslator.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: Build ${{ steps.date.outputs.date }}
          files: py-translate/dist/AnnoTranslator.exe